[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-community-preview"
version = "1.1.0"
description = "Privacy-safe local MCP bridge, document-to-Markdown pipeline, and AI context pack for Aegis Community"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SxnapXSN" }]
dependencies = []

[project.scripts]
aegis-community = "aegis_community.cli:main"
aegis-preview = "aegis_community.cli:main"

[tool.setuptools.packages.find]
include = ["aegis_community*"]
