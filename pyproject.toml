[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-community-preview"
version = "1.1.1"
description = "Local-first MCP bridge for AI document context, Markdown conversion, and safe Aegis Community workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SxnapXSN" }]
dependencies = []

[project.scripts]
aegis-community = "aegis_community.cli:main"
aegis-preview = "aegis_community.cli:main"

[tool.setuptools.packages.find]
include = ["aegis_community*"]
