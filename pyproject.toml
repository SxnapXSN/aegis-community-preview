[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-community-preview"
version = "0.1.1"
description = "Local-only task contract preview for Aegis Stable"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SxnapXSN" }]
dependencies = []

[project.scripts]
aegis-preview = "aegis_community.cli:main"

[tool.setuptools.packages.find]
include = ["aegis_community*"]
