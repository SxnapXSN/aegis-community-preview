name: Public Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel

      - name: Verify package and public boundary
        run: |
          python -m unittest discover -s tests -v
          python scripts/verify_preview_boundary.py .

      - name: Write release checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Aegis Community $GITHUB_REF_NAME" --generate-notes
