name: Preview CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install preview package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test public contract
        run: |
          aegis-community manifest --format json
          aegis-community preflight --format json
      - name: Verify publication boundary
        run: python scripts/verify_preview_boundary.py .
